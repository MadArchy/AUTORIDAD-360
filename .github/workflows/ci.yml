name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff lint
        # La base histórica aún tiene imports/estilo pendientes; bloqueamos errores
        # que hacen el código inválido y dejamos la limpieza completa como deuda aparte.
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Pytest suite (SQLite)
        env:
          APP_ENV: development
          JWT_SECRET_KEY: ci-jwt-secret-key-min-32-chars-long!!
          API_KEY_ENCRYPTION_KEY: ci-enc-secret-key-min-32-chars-long!
          SESSION_SECRET_KEY: ci-session-secret-key-min-32-chars!
          DATABASE_URL: sqlite:///./ci.db
        run: |
          python -m pytest tests/ -q --tb=line

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-blog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-blog/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

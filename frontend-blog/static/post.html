<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nota · Juan Vásquez</title>
  <meta name="description" content="Análisis de autoridad por Juan Vásquez." />
  <link rel="canonical" id="canonical" href="http://127.0.0.1:3002/" />
  <meta property="og:type" content="article" />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:site_name" content="Juan Vásquez" />
  <meta property="og:title" id="og-title" content="Juan Vásquez" />
  <meta property="og:description" id="og-desc" content="Análisis de autoridad para empresas." />
  <meta property="og:url" id="og-url" content="http://127.0.0.1:3002/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="tw-title" content="Juan Vásquez" />
  <meta name="twitter:description" id="tw-desc" content="Análisis de autoridad para empresas." />
  <meta name="author" content="Juan Vásquez" />
  <script type="application/ld+json" id="jsonld">{}</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#e8eef7; --muted:#9aa8bc; --accent:#06b6d4; --line:rgba(255,255,255,.1); }
    body {
      margin:0; color:var(--ink); font-family:"DM Sans",system-ui,sans-serif;
      background: linear-gradient(165deg,#071018,#0c1a28 55%,#08141f); min-height:100vh;
    }
    .shell { max-width:820px; margin:0 auto; padding:40px 20px 80px; }
    a { color:var(--accent); }
    h1 { font-family:"Source Serif 4",Georgia,serif; font-size:clamp(1.6rem,4vw,2.4rem); line-height:1.15; }
    .byline { color:var(--muted); font-size:.9rem; margin:8px 0 0; }
    .meta { color:var(--muted); font-size:.85rem; margin-bottom:12px; }
    .body { line-height:1.7; color:#d5deea; margin-top:24px; }
    .cite { margin-top:36px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:.9rem; }
    .err { color:#fca5a5; }
  </style>
</head>
<body>
  <main class="shell">
    <p><a href="/">← Volver al blog</a></p>
    <div id="root">Cargando…</div>
  </main>
  <script>
    const API = localStorage.getItem('a360_api') || 'http://127.0.0.1:8012/api/v1';
    const pathSlug = location.pathname.startsWith('/blog/')
      ? decodeURIComponent(location.pathname.slice('/blog/'.length).replace(/\/$/, ''))
      : null;
    const slug = new URLSearchParams(location.search).get('slug') || pathSlug;
    const root = document.getElementById('root');
    const SITE = location.origin;

    async function applyBranding() {
      try {
        const res = await fetch(API + '/public/branding?host=' + encodeURIComponent(location.hostname));
        if (!res.ok) return null;
        const b = await res.json();
        window.__A360_BRAND__ = b;
        if (b.primary_color) document.documentElement.style.setProperty('--accent', b.primary_color);
        document.querySelector('meta[property="og:site_name"]')?.setAttribute('content', b.display_name || 'Juan Vásquez');
        return b;
      } catch (_) { return null; }
    }

    function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function plain(html) {
      return String(html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function applySeo(post) {
      const url = SITE + '/blog/' + encodeURIComponent(post.slug);
      const desc = (post.seo_description || plain(post.original_summary || post.content_html || post.source_citation || '')).slice(0, 160)
        || 'Análisis de autoridad por Juan Vásquez.';
      const author = post.author_name || 'Juan Vásquez';
      const reviewer = post.reviewer_name || undefined;
      document.title = post.title + ' · Juan Vásquez';
      const set = (id, val) => { const el = document.getElementById(id); if (el) el.setAttribute(el.tagName === 'LINK' ? 'href' : 'content', val); };
      document.querySelector('meta[name="description"]')?.setAttribute('content', desc);
      document.querySelector('meta[name="author"]')?.setAttribute('content', author);
      set('canonical', url);
      set('og-title', post.title);
      set('og-desc', desc);
      set('og-url', url);
      set('tw-title', post.title);
      set('tw-desc', desc);
      const ld = {
        '@context': 'https://schema.org',
        '@type': 'Article',
        headline: post.title,
        description: desc,
        datePublished: post.published_at || undefined,
        dateModified: post.updated_at || post.published_at || undefined,
        author: { '@type': 'Person', name: author },
        publisher: { '@type': 'Person', name: author },
        mainEntityOfPage: url,
        url,
        citation: post.source_url || undefined,
        articleSection: (post.categories && post.categories[0]) || undefined,
        reviewedBy: reviewer ? { '@type': 'Person', name: reviewer } : undefined,
      };
      document.getElementById('jsonld').textContent = JSON.stringify(ld);
    }

    async function load(){
      if(!slug){ root.innerHTML='<p class="err">Nota no encontrada</p>'; return; }
      const brand = await applyBranding();
      const brandName = (brand && brand.display_name) || 'Juan Vásquez';
      try{
        const res = await fetch(API + '/blog/' + encodeURIComponent(slug));
        if(!res.ok) throw new Error('HTTP '+res.status);
        const p = await res.json();
        applySeo(p);
        const author = p.author_name || brandName;
        document.title = p.title + ' · ' + brandName;
        document.querySelector('meta[property="og:site_name"]')?.setAttribute('content', brandName);
        const reviewer = p.reviewer_name || 'Revisión editorial';
        const cats = Array.isArray(p.categories) ? p.categories : [];
        root.innerHTML = `
          <div class="meta">${p.published_at ? new Date(p.published_at).toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'}) : ''}${cats.length ? ' · ' + esc(cats.join(' · ')) : ''}</div>
          <h1>${esc(p.title)}</h1>
          <p class="byline">Por ${esc(author)} · Revisado por ${esc(reviewer)}</p>
          <article class="body">${p.content_html || ('<p>'+esc(p.original_summary||'')+'</p>')}</article>
          <div class="cite">
            ${p.source_citation ? '<p>'+esc(p.source_citation)+'</p>' : ''}
            ${p.source_url ? '<p>Fuente: <a href="'+esc(p.source_url)+'" target="_blank" rel="noopener">'+esc(p.source_url)+'</a></p>' : ''}
          </div>`;
      }catch(e){
        root.innerHTML = '<p class="err">No se pudo cargar la nota ('+esc(e.message)+').</p>';
      }
    }
    load();
  </script>
</body>
</html>
